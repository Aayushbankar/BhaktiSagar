<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>player-check</title>
<style>body{font:14px monospace;background:#111;color:#ddd;padding:12px}</style>
</head>
<body>
<div id="status">starting…</div>
<pre id="results"></pre>
<script>
(function () {
  'use strict';
  var ids = (new URLSearchParams(location.search).get('ids') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var waitMs = parseInt(new URLSearchParams(location.search).get('wait') || '12000', 10);
  var results = [];
  var idx = 0;
  var apiReady = false;
  var pendingWhenReady = null;

  function render() {
    document.getElementById('results').textContent = 'JSONSTART' + JSON.stringify(results) + 'JSONEND';
    document.getElementById('status').textContent = 'progress ' + idx + '/' + ids.length + (idx >= ids.length ? ' DONE' : '');
    if (idx >= ids.length) { document.title = 'DONE'; }
  }

  function checkOne(id) {
    var finished = false;
    var timer = null;
    var player = null;

    function finish(outcome, code) {
      if (finished) { return; }
      finished = true;
      clearTimeout(timer);
      var st = -1;
      try { st = player && typeof player.getPlayerState === 'function' ? player.getPlayerState() : -1; } catch (e) {}
      try { player.destroy(); } catch (e) {}
      results.push({ id: id, outcome: outcome, code: (code === undefined ? null : code), state: st });
      render();
      idx++;
      run();
    }

    function start() {
      var host = document.createElement('div');
      host.id = 'playerhost';
      document.body.appendChild(host);
      try {
        player = new window.YT.Player(host, {
          videoId: id,
          playerVars: { autoplay: 1, mute: 1, playsinline: 1, controls: 0, rel: 0, modestbranding: 1 },
          events: {
            onReady: function (e) {
              try { e.target.mute(); e.target.playVideo(); } catch (err) {}
              timer = setTimeout(function () { finish('TIMEOUT'); }, waitMs);
            },
            onStateChange: function (e) {
              // 1 = PLAYING, 3 = BUFFERING, 0 = ENDED
              if (e.data === 1 || e.data === 0) { finish(e.data === 1 ? 'PLAYING' : 'ENDED'); }
            },
            onError: function (e) { finish('ERROR', e.data); }
          }
        });
      } catch (err) {
        finish('THROW', String(err && err.message || err));
      }
      // safety net if nothing fires
      timer = timer || setTimeout(function () { finish('NO_EVENT'); }, waitMs);
    }

    if (apiReady) { start(); }
    else { pendingWhenReady = start; }
  }

  function run() {
    if (idx >= ids.length) { render(); return; }
    render();
    // small gap between players
    setTimeout(function () { checkOne(ids[idx]); }, 400);
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    if (pendingWhenReady) { var f = pendingWhenReady; pendingWhenReady = null; f(); }
  };

  render();
  if (ids.length === 0) { document.getElementById('status').textContent = 'no ids'; document.title = 'DONE'; return; }
  run();

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
